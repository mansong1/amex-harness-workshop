databaseChangeLog:
  - changeSet:
      id: create-members-table
      author: harness-lab
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: members
      changes:
        - createTable:
            tableName: members
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(100)
              - column:
                  name: last_name
                  type: varchar(100)
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: add-rewards-tier-column
      author: harness-lab
      changes:
        - addColumn:
            tableName: members
            columns:
              - column:
                  name: rewards_tier
                  type: varchar(50)
                  constraints:
                    nullable: true
  - changeSet:
      id: seed-captain-canary
      author: harness-lab
      comment: Sample member for the workshop app. Its rewards tier is what Lab 6 makes appear.
      changes:
        - insert:
            tableName: members
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: first_name
                  value: Captain
              - column:
                  name: last_name
                  value: Canary
              - column:
                  name: email
                  value: captain.canary@example.com
              - column:
                  name: rewards_tier
                  value: Platinum
      rollback:
        - delete:
            tableName: members
            where: id = 1
  - changeSet:
      id: add-duplicate-column
      author: harness-lab
      changes:
        - addColumn:
            tableName: members
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
      rollback:
        - sql:
            comment: This is a no-op rollback for the invalid column addition.
            sql: SELECT 1;
