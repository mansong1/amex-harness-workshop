databaseChangeLog:
  - changeSet:
      id: create-members-table
      author: harness-lab
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: members
      changes:
        - createTable:
            tableName: members
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(100)
              - column:
                  name: last_name
                  type: varchar(100)
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
