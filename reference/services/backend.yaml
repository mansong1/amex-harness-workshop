# Reference backend service using Harness Artifact Registry (HAR).

service:
  name: backend
  identifier: backend
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: templates
            type: K8sManifest
            spec:
              store:
                type: HarnessCode
                spec:
                  gitConnectorRef: hcr
                  repoName: harness-devsecops
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - harness-deploy/backend/manifests
              valuesPaths:
                - harness-deploy/backend/values.yaml
              skipResourceVersioning: false
      # Organiser-built Django image in the org-scoped HAR registry shared by all
      # projects in org event_hws274 (see ORGANISER-SETUP.md section 1b). Attendees
      # don't build the backend; bump the tag when the organisers rebuild it.
      artifacts:
        primary:
          primaryArtifactRef: backend
          sources:
            - identifier: backend
              type: Har
              spec:
                registryRef: workshop-shared
                type: docker
                spec:
                  imagePath: harness-workshop-backend
                  tag: "1.1.0"
