# Reference backend service using Harness Artifact Registry (HAR).

service:
  name: backend
  identifier: backend
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: templates
            type: K8sManifest
            spec:
              store:
                type: HarnessCode
                spec:
                  gitConnectorRef: hcr
                  repoName: harness-devsecops
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - harness-deploy/backend/manifests
              valuesPaths:
                - harness-deploy/backend/values.yaml
              skipResourceVersioning: false
      # Organizer-built Django image in the account-level HAR registry workshop-shared
      # (see ORGANIZER-SETUP.md section 1b). Provisioning Terraform sets this on each
      # project's backend service. Attendees don't build the backend; bump the tag
      # via backend_image_tag when organizers rebuild it.
      artifacts:
        primary:
          primaryArtifactRef: backend
          sources:
            - identifier: backend
              type: Har
              spec:
                registryRef: account.workshop-shared
                type: docker
                spec:
                  imagePath: harness-workshop-backend
                  tag: "1.1.0"
