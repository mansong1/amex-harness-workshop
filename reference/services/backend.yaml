# Reference backend service using Harness Artifact Registry (HAR).

service:
  name: backend
  identifier: backend
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: templates
            type: K8sManifest
            spec:
              store:
                type: HarnessCode
                spec:
                  gitConnectorRef: hcr
                  repoName: harness-devsecops
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - harness-deploy/backend/manifests
              valuesPaths:
                - harness-deploy/backend/values.yaml
              skipResourceVersioning: false
      artifacts:
        primary:
          primaryArtifactRef: backend
          sources:
            - identifier: backend
              type: Har
              spec:
                registryRef: workshop
                type: docker
                spec:
                  imagePath: harness-workshop
                  tag: <+variable.username>-<+pipeline.sequenceId>
