# Reference frontend service using Harness Artifact Registry (HAR).
# Replace projectIdentifier / orgIdentifier to match the attendee project.
# registryRef is the org registry <org_id>-workshop; if the expression
# is rejected, use the literal name, e.g. event_hws274-workshop.

service:
  name: frontend
  identifier: frontend
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: templates
            type: K8sManifest
            spec:
              store:
                type: HarnessCode
                spec:
                  gitConnectorRef: hcr
                  repoName: harness-devsecops
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - harness-deploy/frontend/manifests
              valuesPaths:
                - harness-deploy/frontend/values.yaml
              skipResourceVersioning: false
      artifacts:
        primary:
          primaryArtifactRef: frontend
          sources:
            - identifier: frontend
              type: Har
              spec:
                registryRef: <+org.identifier>-workshop
                type: docker
                spec:
                  imagePath: harness-workshop
                  tag: <+variable.username>-<+pipeline.sequenceId>
