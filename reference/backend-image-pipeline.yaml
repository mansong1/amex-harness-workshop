# One-off organizer pipeline: build backend/Dockerfile and push it to the
# account-level HAR registry `workshop-shared` that every workshop project pulls from.
#
# Import into ONE organizer project whose `harness-devsecops` repo has the current
# app code (after feat/amex-app-redesign is merged). Run it again, with a new tag,
# whenever backend/ changes, then bump backend_image_tag in the provisioning
# Terraform (and the seeded backend service if needed).
pipeline:
  name: build-backend-image
  identifier: build_backend_image
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: hcr
        repoName: harness-devsecops
        build: <+input>
  variables:
    - name: backend_tag
      type: String
      description: Version tag for the backend image, e.g. 1.2.2 (never only latest)
      required: true
      value: <+input>.default(1.2.2)
  stages:
    - stage:
        name: Build backend
        identifier: build_backend
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Push backend to HAR
                  identifier: push_backend_har
                  spec:
                    # HAR: registryRef, not connectorRef. Account-level registry.
                    registryRef: account.workshop-shared
                    repo: harness-workshop-backend
                    tags:
                      - <+pipeline.variables.backend_tag>
                    caching: true
                    dockerfile: /harness/backend/Dockerfile
                    context: /harness/backend
