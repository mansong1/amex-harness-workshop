<div class="dist-page">
  <header class="dist-header">
    <div>
      <p class="eyebrow">Validate release</p>
      <h1>Distribution Test</h1>
      <p class="subtitle">Synthetic traffic split between <strong>canary</strong> and <strong>normal</strong> instances.</p>
    </div>
    <div class="dist-controls">
      <button class="icon-btn" (click)="run()" title="Start" aria-label="Start distribution test">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
          <path d="M6.79 5.093A.5.5 0 0 0 6 5.5v5a.5.5 0 0 0 .79.407l3.5-2.5a.5.5 0 0 0 0-.814z"/>
          <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 0a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z"/>
        </svg>
      </button>
      <button class="icon-btn" (click)="refreshDistribution()" title="Refresh" aria-label="Refresh chart">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
          <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
        </svg>
      </button>
      <a class="back-link" href="/home">← Back to dashboard</a>
    </div>
  </header>

  <section class="chart-card">
    <div class="chart-wrap">
      <ngx-charts-line-chart
        [scheme]="colorScheme"
        [results]="data"
        [xAxis]="true"
        [yAxis]="true"
        [legend]="true"
        [customColors]="customColor"
        [showXAxisLabel]="true"
        [showYAxisLabel]="false"
        xAxisLabel="Time"
        yAxisLabel="Number of Entries">
      </ngx-charts-line-chart>
    </div>
  </section>
</div>
